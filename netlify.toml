# ============================================
#  Nexyra Studio — Netlify configuration
# ============================================

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ── API routes ──
# The pages call /api/<name>; Netlify serves functions from
# /.netlify/functions/<name>, so map one onto the other.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# ── Clean URLs ──
[[redirects]]
  from = "/verify"
  to = "/verify.html"
  status = 200

# The admin panel's file is named staff-portal.html, so this is
# just the extensionless form of it.
[[redirects]]
  from = "/staff-portal"
  to = "/staff-portal.html"
  status = 200

# Old guesses at the admin path go home rather than revealing anything.
[[redirects]]
  from = "/admin"
  to = "/"
  status = 302

[[redirects]]
  from = "/admin.html"
  to = "/"
  status = 302

# ── 404 ──
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ── Headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Keep the admin panel out of search engines
[[headers]]
  for = "/staff-portal"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
